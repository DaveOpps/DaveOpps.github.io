<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dave Opps — Business Card</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0a0a0a;
    --white: #f5f5f0;
    --cyan: #00e5ff;
    --orange: #ff4d00;
    --gray: #888;
  }

  body {
    background: #111;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 48px;
    padding: 60px 20px;
    font-family: 'Barlow', sans-serif;
  }

  .label {
    font-size: 10px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: #444;
    text-align: center;
  }

  /* ── CARD WRAPPER ── */
  .card-wrap {
    perspective: 1200px;
    cursor: pointer;
  }

  .card-inner {
    position: relative;
    width: 680px;
    height: 380px;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.4, 0, 0.2, 1);
  }

  .card-wrap:hover .card-inner {
    transform: rotateY(180deg);
  }

  .card-face {
    position: absolute;
    inset: 0;
    border-radius: 16px;
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
    overflow: hidden;
  }

  /* ── FRONT FACE ── */
  .card-front {
    background: var(--black);
    display: flex;
    align-items: stretch;
  }

  /* Grid texture */
  .card-front::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.04) 1px, transparent 1px);
    background-size: 28px 28px;
    pointer-events: none;
    z-index: 0;
  }

  /* Glow blob */
  .card-front::after {
    content: '';
    position: absolute;
    top: -60px; right: -60px;
    width: 260px; height: 260px;
    background: radial-gradient(circle, rgba(0,229,255,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* Left color stripe */
  .stripe {
    width: 8px;
    background: linear-gradient(180deg, var(--cyan) 0%, var(--orange) 100%);
    flex-shrink: 0;
    position: relative;
    z-index: 1;
  }

  .front-content {
    flex: 1;
    padding: 44px 48px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    position: relative;
    z-index: 1;
  }

  /* Top: logo area */
  .logo-row {
    display: flex;
    align-items: center;
    gap: 18px;
    animation: slideIn 0.6s ease forwards;
    opacity: 0;
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateX(-16px); }
    to   { opacity: 1; transform: translateX(0); }
  }

  .hex {
    width: 64px;
    height: 64px;
    background: var(--cyan);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
  }

  .hex::after {
    content: '';
    position: absolute;
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--orange);
    bottom: 2px; right: 6px;
  }

  .hex span {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 24px;
    color: var(--black);
    letter-spacing: -1px;
  }

  .name-stack { display: flex; flex-direction: column; gap: 0; }

  .name-first {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 34px;
    line-height: 1;
    color: var(--white);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .name-last {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 34px;
    line-height: 1;
    color: var(--cyan);
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  /* Bottom: contact info */
  .contact-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 32px;
    animation: slideIn 0.6s 0.2s ease forwards;
    opacity: 0;
  }

  .contact-item {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .contact-label {
    font-size: 8px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--cyan);
    opacity: 0.7;
    font-weight: 600;
  }

  .contact-value {
    font-size: 13px;
    color: var(--white);
    font-weight: 500;
    opacity: 0.9;
  }

  /* Title badge */
  .title-badge {
    position: absolute;
    top: 44px;
    right: 48px;
    border: 1px solid rgba(0,229,255,0.25);
    padding: 6px 14px;
    border-radius: 2px;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--cyan);
    opacity: 0.7;
    animation: slideIn 0.6s 0.1s ease forwards;
    opacity: 0;
  }

  /* Corner marks */
  .corner {
    position: absolute;
    width: 16px; height: 16px;
    z-index: 2;
  }
  .corner.tl { top: 16px; left: 20px; border-top: 1.5px solid rgba(0,229,255,0.3); border-left: 1.5px solid rgba(0,229,255,0.3); }
  .corner.br { bottom: 16px; right: 16px; border-bottom: 1.5px solid rgba(0,229,255,0.3); border-right: 1.5px solid rgba(0,229,255,0.3); }

  /* ── BACK FACE ── */
  .card-back {
    background: var(--cyan);
    transform: rotateY(180deg);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-direction: column;
    gap: 24px;
  }

  .card-back::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,0,0,0.07) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,0,0,0.07) 1px, transparent 1px);
    background-size: 24px 24px;
  }

  .back-hex {
    width: 100px;
    height: 100px;
    background: var(--black);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    z-index: 1;
  }

  .back-hex span {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 36px;
    color: var(--cyan);
    letter-spacing: -2px;
  }

  .back-name {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 28px;
    letter-spacing: 6px;
    text-transform: uppercase;
    color: var(--black);
    position: relative;
    z-index: 1;
  }

  .back-tagline {
    font-size: 9px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgba(0,0,0,0.5);
    position: relative;
    z-index: 1;
  }

  /* Orange accent line on back */
  .back-line {
    width: 48px;
    height: 3px;
    background: var(--orange);
    border-radius: 2px;
    position: relative;
    z-index: 1;
  }

  /* Hover hint */
  .hint {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #333;
    text-align: center;
    animation: blink 2s ease-in-out infinite;
  }

  @keyframes blink {
    0%, 100% { opacity: 0.5; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<div class="label">Business Card — Dave Opps</div>

<div class="card-wrap">
  <div class="card-inner">

    <!-- FRONT -->
    <div class="card-face card-front">
      <div class="stripe"></div>
      <div class="front-content">

        <div class="logo-row">
          <div class="hex"><span>DO</span></div>
          <div class="name-stack">
            <span class="name-first">Dave</span>
            <span class="name-last">Opps</span>
          </div>
        </div>

        <div class="title-badge">Tech Innovator</div>

        <div class="contact-grid">
          <div class="contact-item">
            <span class="contact-label">Email</span>
            <span class="contact-value">DaveOpps13@gmail.com</span>
          </div>
          <div class="contact-item">
            <span class="contact-label">Alt Email</span>
            <span class="contact-value">ayisidavid13@gmail.com</span>
          </div>
          <div class="contact-item">
            <span class="contact-label">GitHub</span>
            <span class="contact-value">https://daveopps.github.io</span>
          </div>
        </div>

      </div>
      <div class="corner tl"></div>
      <div class="corner br"></div>
    </div>

    <!-- BACK -->
    <div class="card-face card-back">
      <div class="back-hex"><span>DO</span></div>
      <div class="back-line"></div>
      <div class="back-name">Dave Opps</div>
      <div class="back-tagline">Technology · Innovation · Vision</div>
    </div>

  </div>
</div>

<div class="hint">Hover to flip the card</div>

</body>
</html>
