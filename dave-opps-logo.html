<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dave Opps — Personal Logo</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700;900&family=Barlow:wght@400;600&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --black: #0a0a0a;
    --white: #f5f5f0;
    --cyan: #00e5ff;
    --orange: #ff4d00;
    --mid: #1a1a1a;
  }

  body {
    background: var(--black);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'Barlow', sans-serif;
    gap: 60px;
    padding: 40px 20px;
  }

  h2 {
    color: #555;
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    text-align: center;
  }

  /* ── LOGO CARD ── */
  .logo-showcase {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 48px;
  }

  .card {
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 60px 80px;
    border-radius: 4px;
    position: relative;
    overflow: hidden;
    animation: fadeIn 0.8s ease forwards;
    opacity: 0;
  }

  .card.dark  { background: var(--black); border: 1px solid #222; }
  .card.light { background: var(--white); }
  .card.color { background: var(--cyan); }

  @keyframes fadeIn {
    to { opacity: 1; }
  }
  .card:nth-child(2) { animation-delay: 0.2s; }
  .card:nth-child(3) { animation-delay: 0.4s; }

  /* ── THE LOGO ── */
  .logo {
    display: flex;
    align-items: center;
    gap: 20px;
    position: relative;
  }

  /* Monogram badge */
  .monogram {
    width: 72px;
    height: 72px;
    background: var(--cyan);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    position: relative;
    animation: pulse 3s ease-in-out infinite;
  }

  .monogram.on-light { background: var(--orange); }
  .monogram.on-cyan  { background: var(--black); }

  @keyframes pulse {
    0%, 100% { transform: scale(1); }
    50% { transform: scale(1.04); }
  }

  .monogram span {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 28px;
    color: var(--black);
    letter-spacing: -1px;
    line-height: 1;
  }

  .monogram.on-light span { color: var(--white); }
  .monogram.on-cyan span  { color: var(--cyan); }

  /* Name text */
  .name-block {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .name-first {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 700;
    font-size: 38px;
    line-height: 1;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--white);
  }

  .name-last {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 38px;
    line-height: 1;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--cyan);
  }

  .card.light .name-first { color: var(--black); }
  .card.light .name-last  { color: var(--orange); }
  .card.color .name-first { color: var(--black); }
  .card.color .name-last  { color: var(--black); opacity: 0.5; }

  /* Divider line */
  .divider {
    width: 2px;
    height: 48px;
    background: var(--cyan);
    opacity: 0.3;
  }
  .card.light .divider { background: var(--orange); }
  .card.color .divider { background: var(--black); }

  /* Tagline */
  .tagline {
    font-size: 9px;
    letter-spacing: 3.5px;
    text-transform: uppercase;
    color: #555;
    font-weight: 600;
    margin-top: 4px;
  }
  .card.light .tagline { color: #aaa; }
  .card.color .tagline { color: rgba(0,0,0,0.45); }

  /* Accent dot */
  .accent-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--orange);
    position: absolute;
    bottom: -1px;
    right: 0;
  }
  .card.light .accent-dot { background: var(--cyan); }
  .card.color .accent-dot { background: var(--black); }

  /* Grid of variants label row */
  .variants-row {
    display: flex;
    gap: 24px;
    flex-wrap: wrap;
    justify-content: center;
  }

  .variant-label {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: #444;
    text-align: center;
    width: 200px;
  }

  /* Standalone icon-only version */
  .icon-only-row {
    display: flex;
    gap: 24px;
    align-items: center;
  }

  .icon-sm {
    width: 52px;
    height: 52px;
    background: var(--cyan);
    clip-path: polygon(50% 0%, 100% 25%, 100% 75%, 50% 100%, 0% 75%, 0% 25%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .icon-sm.v2 { background: var(--orange); }
  .icon-sm.v3 { background: var(--white); }

  .icon-sm span {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 900;
    font-size: 20px;
    color: var(--black);
  }

  /* Background grid texture on dark card */
  .card.dark::before {
    content: '';
    position: absolute;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 32px 32px;
    pointer-events: none;
  }

  /* Corner accent */
  .card.dark::after {
    content: '';
    position: absolute;
    top: 0; left: 0;
    width: 40px; height: 40px;
    border-top: 2px solid var(--cyan);
    border-left: 2px solid var(--cyan);
    opacity: 0.4;
  }
</style>
</head>
<body>

<h2>Dave Opps — Personal Logo</h2>

<div class="logo-showcase">

  <!-- DARK VERSION -->
  <div class="card dark">
    <div class="logo">
      <div class="monogram">
        <span>DO</span>
        <div class="accent-dot"></div>
      </div>
      <div class="divider"></div>
      <div class="name-block">
        <span class="name-first">Dave</span>
        <span class="name-last">Opps</span>
        <span class="tagline">Technology · Innovation</span>
      </div>
    </div>
  </div>

  <!-- LIGHT VERSION -->
  <div class="card light">
    <div class="logo">
      <div class="monogram on-light">
        <span>DO</span>
        <div class="accent-dot"></div>
      </div>
      <div class="divider"></div>
      <div class="name-block">
        <span class="name-first">Dave</span>
        <span class="name-last">Opps</span>
        <span class="tagline">Technology · Innovation</span>
      </div>
    </div>
  </div>

  <!-- CYAN ACCENT VERSION -->
  <div class="card color">
    <div class="logo">
      <div class="monogram on-cyan">
        <span>DO</span>
        <div class="accent-dot"></div>
      </div>
      <div class="divider"></div>
      <div class="name-block">
        <span class="name-first">Dave</span>
        <span class="name-last">Opps</span>
        <span class="tagline">Technology · Innovation</span>
      </div>
    </div>
  </div>

</div>

<!-- Icon-only marks -->
<div style="text-align:center">
  <h2 style="margin-bottom:20px">Icon mark variants</h2>
  <div class="icon-only-row">
    <div class="icon-sm"><span>DO</span></div>
    <div class="icon-sm v2"><span>DO</span></div>
    <div class="icon-sm v3"><span>DO</span></div>
  </div>
</div>

<div class="variants-row">
  <span class="variant-label">Dark (Primary)</span>
  <span class="variant-label">Light (Print)</span>
  <span class="variant-label">Accent (Brand)</span>
</div>

</body>
</html>
